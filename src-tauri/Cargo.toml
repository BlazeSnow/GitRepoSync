[package]
name = "git-repo-sync"
version = "1.0.0-beta.1"
description = "Git Repo Sync - 跨平台 Git 仓库同步工具"
authors = ["BlazeSnow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
