name: Check

on:
  pull_request:
    branches: [main]

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 合并到 main 前校验所有版本文件与 package.json 一致（version.ps1 的 CI 侧守卫）
      - name: Check version consistency
        shell: bash
        run: bash ci/check-version.sh "$(node -p "require('./package.json').version")"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 前端单元测试（vitest，纯 Node 环境无系统依赖）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端测试
        run: pnpm test

      # 后端单元测试（Tauri 编译需要 Linux 系统库）
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        run: bash ci/linux-deps.sh

      - name: 后端测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
