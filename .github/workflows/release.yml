# https://github.com/marketplace/actions/tauri-action

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M 系列芯片)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel 芯片
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: 检查版本一致性
        shell: bash
        run: bash ci/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: bash ci/linux-deps.sh

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Git Repo Sync ${{ github.ref_name }}"
          releaseBody: "完整更新日志见 [CHANGELOG.md](https://github.com/BlazeSnow/GitRepoSync/blob/main/CHANGELOG.md)"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
